name: Verify candidate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: ruff check backend/app backend/tests
      - run: ruff format --check backend/app backend/tests backend/migrations
      - run: cd backend && pytest -q
      - run: cd backend && pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agent:disposable-ci-only@localhost:5432/agent_test
      - run: python scripts/check_migrations.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agent:disposable-ci-only@localhost:5432/agent_test
      - run: docker build -f deploy/Dockerfile -t personal-agent:ci .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false' 
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: cd android && ./gradlew assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-candidate
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-debug.*
          retention-days: 7
